[tool.poetry]
name = "hybrid-search-opensearch"
version = "0.0.17"
description = "Hybrid search with OpenSearch and Langchain"
authors = ["Alex Karmazin <karmazinalex@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "hybrid_search"}]
keywords = ["python", "llm", "science", "review", "hybrid search", "semantic search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]

[tool.poetry.dependencies]
python = "^3.11"
pycomfort = ">=0.0.16"
peft = "*"
triton = "*"
click = "*"
transformers = ">=4.44.2"
sentence-transformers = "*"
opensearch-py = ">=2.8.0"
langchain = ">=0.3.9"
langchain-community = ">=0.3.9"
langchain-huggingface = ">=0.1.2"
FlagEmbedding = ">=1.3.3"