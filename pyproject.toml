[tool.poetry]
name = "hybrid_search_project"
version = "0.0.17"
package-mode = false
description = "Hybrid search implementations with different engines"
authors = [
    "Alex Karmazin <karmazinalex@gmail.com>",
    "Anton Kulaga <antonkulaga@gmail.com>"
]
license = "Apache-2.0"
readme = "README.md"
packages = []  # No packages at root level, using namespace packages
keywords = ["python", "llm", "science", "review", "hybrid search", "semantic search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]

[tool.poetry.dependencies]
python = "^3.11"
hybrid-search-core = { path = "core", develop = true }
hybrid-search-opensearch = { path = "opensearch", develop = true }
hybrid-search-meili = { path = "meili", develop = true }
pyfunctional = ">=1.5.0"
[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
click = "*"
pycomfort = ">=0.0.15"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api" 